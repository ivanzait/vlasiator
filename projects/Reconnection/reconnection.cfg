# ============================================================
# Reconnection project — 2D GEM-challenge-like setup
# Background and Sheet defined with different Temperature
# ============================================================

project = Reconnection
ParticlePopulations = proton

dynamic_timestep = 1
hallMinimumRho = 1e4

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

# ------ velocity space ------
# T = 72081 K  (β=0.25),  vth = 24.4 km/s
# ±7.4 vth = ±180 km/s  (reconnection jets at ~vA=69 km/s = 2.8 vth, well within range)
# vx_length=15: block_width = 360/15 = 24 km/s, cell_width = 6 km/s = 0.25 vth
#               max 15^3 = 3375 blocks/cell  (vs 8000 at β=1)
[proton_vspace]
vx_min = -3.4e+05
vx_max =  3.4e+05
vy_min = -3.4e+05
vy_max =  3.4e+05
vz_min = -3.4e+05
vz_max =  3.4e+05
vx_length = 44
vy_length = 44
vz_length = 44

[proton_sparse]
minValue = 1.0e-15 

# ------ spatial grid ------
[gridbuilder]
x_length = 256
y_length = 1
z_length = 64
x_min = -1.843456e+06
x_max =  1.843456e+06
y_min = -7.201e+03
y_max =  7.201e+03
z_min = -4.60864e+05
z_max =  4.60864e+05
t_max = 100.0      # ~48 Omega_ci^-1 at B0 = 5 nT
dt = 0.02          # initial; CFL will limit further

[bailout]
max_memory = 500        # [GB/node]
min_dt = 1e-6           # [s]
velocity_space_wall_block_margin = 0

# ------ I/O ------
[io]
diagnostic_write_interval = 1
write_initial_state = 1
restart_walltime_interval = 72000     
number_of_restarts = 1
system_write_t_interval = 1.31   
system_write_file_name = bulk
system_write_distribution_stride = 16  
system_write_distribution_xline_stride = 1   
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 4   

# ------ output variables ------
[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_pressure
output = vg_e_vol
output = vg_b_vol
diagnostic = populations_vg_blocks

# ------ load balancing ------
[loadBalance]
rebalanceInterval = 25

# ------ field solver ------
[fieldsolver]
ohmHallTerm = 2
ohmGradPeTerm = 0
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50

# ------ Vlasov solver ------
[vlasovsolver]
minCFL = 0.6
maxCFL = 0.8
maxSlAccelerationRotation = 22
maxSlAccelerationSubcycles = 2

# ------ boundaries ------
[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = no
boundary = Outflow

[outflow]
precedence = 3
[proton_outflow]
face = z+
face = z-

# ------ project parameters ------
[Reconnection]
lambda = 72010.0            # current-sheet half-thickness [m]  (= 1 d_i)
Bx0 = 5.89e-9                # lobe field [T]  (= 10 nT)
By0 = 0.0                   # guide field [T]  (0 = anti-parallel)
Bz0 = 0.0                   # initial normal field [T]
Psi0 = -8.64e-5 

[proton_Reconnection]
n = 1.0e7          
T = 1.0e5             
n_bg_frac = 0.2         
T_bg_frac = 0.2
Ui = 4.06e4          
nSpaceSamples = 1
nVelocitySamples = 1
